# seiva-agent — the agent harness a developer extends (ADR 0048, G5).
#
# A small, bounded loop: ask the model through the gateway, run the tools it
# calls, feed the results back, repeat — within steps, tokens, wall time and a
# cancel signal. Tools are local functions, module facades in-process (feature
# `facades`) or tools from allowlisted MCP servers, whose descriptions are pinned
# by hash. Writes wait for an approver; hooks see every call; memory is a port.
# DORM-free and http-client-free (the MCP client talks through seiva-llm's
# `HttpTransport` port).
[package]
name = "seiva-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "The agent harness of Delonix Seiva: a bounded tool loop through the AI gateway, local, facade and MCP tools, pinned MCP tool descriptions, approvals for writes, hooks and memory."
readme = "README.md"
keywords = ["agent", "llm", "mcp", "tools", "seiva"]
categories = ["asynchronous"]

[features]
default = ["facades"]
# Module facades as in-process tools, through `seiva-mcp-server`'s `ToolSet`.
facades = ["dep:seiva-mcp-server"]

[dependencies]
seiva = { workspace = true }
seiva-llm = { version = "0.2.2", path = "../seiva-llm", default-features = false }
seiva-ai-gateway = { version = "0.2.2", path = "../seiva-ai-gateway" }
seiva-identity = { version = "0.2.2", path = "../seiva-identity" }
seiva-mcp-server = { version = "0.2.2", path = "../seiva-mcp-server", optional = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde_json = "1"
sha2 = "0.10"
tokio = { workspace = true, features = ["time", "sync", "macros"] }
tracing = { version = "0.1" }

[dev-dependencies]
seiva-testing = { workspace = true, features = ["llm"] }
seiva-contract = { path = "../seiva-contract" }
seiva-http = { path = "../seiva-http" }
serde = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
tower = { version = "0.5", features = ["util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# The tests use module facades (and a real seiva-mcp-server).
[[test]]
name = "agent"
required-features = ["facades"]

[[test]]
name = "mcp"
required-features = ["facades"]
