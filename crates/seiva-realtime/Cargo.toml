# seiva-realtime — a first-class, protocol-neutral WebSocket + SSE hub (ADR 0031).
#
# The framework's real-time primitive: a sharded connection registry (the `Hub`)
# that fans opaque `Frame`s out to the subscribers of a `Topic`, authenticates
# the connection BEFORE the upgrade completes (deny-by-default + an `Origin`
# allowlist against CSWSH), and sheds a slow consumer instead of buffering it
# without bound. It is DORM-FREE and carries *frames*, not *meanings*: the
# message protocol (offer/answer/ice, chat, presence) is the product's policy.
#
# Zero-cost when unused: `tokio` enters with NO runtime feature, so the default
# build links no executor. The axum WebSocket/SSE transport is behind the `ws`
# feature and the multi-pod Redis bridge behind `redis-bridge` — a service that
# pushes nothing opts into neither and pays for neither.
[package]
name = "seiva-realtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Delonix Seiva — a first-class, protocol-neutral WebSocket + SSE hub (ADR 0031): sharded topic fan-out, authenticate-before-upgrade with an Origin allowlist, per-connection backpressure, and a multi-pod broadcast bridge. DORM-free; no runtime linked unless a transport feature is enabled."
keywords = ["seiva", "websocket", "sse", "realtime", "hub"]
categories = ["web-programming", "network-programming"]

[dependencies]
# The opaque frame payload; shared with axum's ws/body types so a Binary frame
# crosses the transport boundary without a copy.
bytes = "1"
# The sharded registry: lock-contention-free subscribe/unsubscribe/fan-out, one
# shard per bucket instead of a single mutex over every connection.
dashmap = "6"
async-trait = "0.1"
tracing = "0.1"
# NO runtime feature: the library links no executor (ADR 0026/0031). `sync` for
# the bounded per-connection queue + the connection semaphore, `time` for the
# heartbeat, `macros` for `select!` in the transport. A runtime is the server's.
tokio = { version = "1", default-features = false, features = ["sync", "time", "macros"] }
# The authenticated caller the socket is bound to, and the isolation scope — the
# same identity model every Seiva transport builds on (ADR 0006). Both are core,
# data-layer-free crates: no runtime rides in through them.
seiva-identity = { version = "0.2.1", path = "../seiva-identity" }
seiva-ports = { version = "0.2.1", path = "../seiva-ports" }
# Hash the dev connection-token at rest, exactly like `seiva-identity`'s token map.
sha2 = "0.10"

# --- optional transports / bridges (zero-cost when the feature is off) ---
# The axum WebSocket upgrade + SSE response. `ws` is NOT an axum default feature;
# it is enabled ONLY here, never in the core (ADR 0031).
axum = { version = "0.8", default-features = false, features = ["ws"], optional = true }
# Stream/Sink glue for the socket pump and the SSE body; also drives the Redis
# pub/sub receive loop.
futures-util = { version = "0.3", optional = true }
# A Binary frame is base64-encoded for the text-only SSE channel.
base64 = { version = "0.22", optional = true }
# The multi-pod broadcast bridge: a client on pod A receives what pod B publishes
# to the same topic. Same client/features as `seiva-ratelimit-redis` (proven in
# this workspace); NOT a base dependency.
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager", "aio"], optional = true }

[features]
default = []
# The axum WebSocket + SSE transport. Pulls axum's `ws` feature (and a runtime,
# through axum) — the server composition, never the core library.
ws = ["dep:axum", "dep:futures-util", "dep:base64"]
# The Redis pub/sub multi-pod bridge adapter.
redis-bridge = ["dep:redis", "dep:futures-util"]

[dev-dependencies]
# The tests DO need a runtime to drive the async Hub/auth/backpressure proofs —
# a dev-dependency only, so it never reaches a downstream build.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
