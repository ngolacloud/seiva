# seiva-http — the framework's HTTP transport (first cut).
#
# Serves a module's facades over HTTP with axum/tower. Errors are RFC 9457
# `application/problem+json`; bodies are typed and validated; a permission guard
# is driven by the facade's `MethodDescriptor.requires`; health endpoints report
# a Starting/Ready/Draining lifecycle. DORM-FREE: this crate never links the data
# layer. It depends on the contract (`delonix-seiva`, default features OFF so the
# `dorm` toggle stays off) and the trait-only ports.
#
# still resolving the `../delonix-seiva` and `../seiva-ports` path dependencies,
# which keep their membership in the parent Seiva workspace.

[package]
name = "seiva-http"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["NgolaCloud <angolar.devops@gmail.com>"]
repository = "https://github.com/ngolacloud/seiva"
homepage = "https://github.com/ngolacloud/seiva"
rust-version = "1.75"
description = "Delonix Seiva — HTTP transport (axum/tower): RFC 9457 problems, typed/validated bodies, descriptor-driven permission guard, health endpoints. DORM-free."

[dependencies]
# The contract crate, data-layer OFF: we read `FacadeDescriptor` to drive routing
# and the permission guard. default-features = false keeps the `dorm` toggle off.
delonix-seiva = { version = "0.1.0", path = "../delonix-seiva", default-features = false }
# The trait-only ports: we map their opaque `BoxError` into an RFC 9457 problem.
seiva-ports = { version = "0.1.0", path = "../seiva-ports" }
# The verified caller: `Principal` and the `Authenticator` the authn middleware
# runs. Transport-free, so the same identity model serves HTTP and MCP (ADR 0006).
seiva-identity = { version = "0.1.0", path = "../seiva-identity" }
# The OpenAPI 3.1 generator: `/openapi.json` is generated from the facades
# linked into the binary, not hand-written. Data-layer-free like this crate.
seiva-openapi = { version = "0.1.0", path = "../seiva-openapi" }

axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Canonical request fingerprint for idempotency (ADR 0011): SHA-256 over the
# scoped-key tuple and the request's canonical JSON. serde_json's default Map is
# a BTreeMap, so object keys serialise in sorted order — a stable fingerprint.
sha2 = "0.10"
# CORS enforcement: the battle-tested tower layer rather than a hand-rolled
# preflight. Only the `cors` feature; the secure default mounts no layer at all.
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
# Drives the router without a live server: `ServiceExt::oneshot`.
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt", "macros"] }
# A controllable `Clock` so the rate-limiter's window is tested without sleeping.
seiva-testing = { version = "0.1.0", path = "../seiva-testing" }
