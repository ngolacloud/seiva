# seiva-http — the framework's HTTP transport (first cut).
#
# Serves a module's facades over HTTP with axum/tower. Errors are RFC 9457
# `application/problem+json`; bodies are typed and validated; a permission guard
# is driven by the facade's `MethodDescriptor.requires`; health endpoints report
# a Starting/Ready/Draining lifecycle. DORM-FREE: this crate never links the data
# layer. It depends on the contract (`delonix-seiva`, default features OFF so the
# `dorm` toggle stays off) and the trait-only ports.
#
# still resolving the `../delonix-seiva` and `../seiva-ports` path dependencies,
# which keep their membership in the parent Seiva workspace.

[package]
name = "seiva-http"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["NgolaCloud <angolar.devops@gmail.com>"]
repository = "https://github.com/ngolacloud/seiva"
homepage = "https://github.com/ngolacloud/seiva"
rust-version = "1.75"
description = "Delonix Seiva — HTTP transport (axum/tower): RFC 9457 problems, typed/validated bodies, descriptor-driven permission guard, health endpoints. DORM-free."

[dependencies]
# The contract crate, data-layer OFF: we read `FacadeDescriptor` to drive routing
# and the permission guard. default-features = false keeps the `dorm` toggle off.
delonix-seiva = { path = "../delonix-seiva", default-features = false }
# The trait-only ports: we map their opaque `BoxError` into an RFC 9457 problem.
seiva-ports = { path = "../seiva-ports" }
# The OpenAPI 3.1 generator: `/openapi.json` is generated from the mounted
# facade descriptors, not hand-written. Data-layer-free like this crate.
seiva-openapi = { path = "../seiva-openapi" }
# The demonstration subject: one facade mounted as a route, guarded by its
# descriptor. Brought in as a normal dependency so `router` can serve it.
notes-facade = { path = "../../examples/notes/facade" }

axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Drives the router without a live server: `ServiceExt::oneshot`.
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt", "macros"] }
