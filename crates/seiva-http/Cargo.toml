# seiva-http — the framework's HTTP transport (first cut).
#
# Serves a module's facades over HTTP with axum/tower. Errors are RFC 9457
# `application/problem+json`; bodies are typed and validated; a permission guard
# is driven by the facade's `MethodDescriptor.requires`; health endpoints report
# a Starting/Ready/Draining lifecycle. DORM-FREE: this crate never links the data
# layer. It depends on the contract (`seiva`, default features OFF so the
# `dorm` toggle stays off) and the trait-only ports.
#
# still resolving the `../seiva` and `../seiva-ports` path dependencies,
# which keep their membership in the parent Seiva workspace.

[package]
name = "seiva-http"
version = "0.2.3"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["NgolaCloud <angolar.devops@gmail.com>"]
repository = "https://github.com/ngolacloud/seiva"
homepage = "https://github.com/ngolacloud/seiva"
rust-version = "1.75"
description = "Delonix Seiva — HTTP transport (axum/tower): RFC 9457 problems, typed/validated bodies, descriptor-driven permission guard, health endpoints. DORM-free."
keywords = ["http", "axum", "web", "openapi", "framework"]
categories = ["web-programming::http-server"]

[dependencies]
# The contract crate, data-layer OFF: we read `FacadeDescriptor` to drive routing
# and the permission guard. default-features = false keeps the `dorm` toggle off.
seiva = { version = "0.2.3", path = "../seiva", default-features = false }
# The trait-only ports: we map their opaque `BoxError` into an RFC 9457 problem.
seiva-ports = { version = "0.2.3", path = "../seiva-ports" }
# The transport-neutral contract types: `Validate`/`ValidationError` live here so
# the `facade` layer validates without naming this transport crate (ADR 0003). We
# re-export them (`seiva_http::{Validate, ValidationError}`) and the `Valid<T>`
# extractor runs the check.
seiva-contract = { version = "0.2.3", path = "../seiva-contract" }
# The CQRS dispatch core: the `CommandHandler`/`QueryHandler` traits the pipeline
# behaviors (`bus`) implement, so `Authorize`/`Idempotent` compose with the
# transport-free `Validate`/`Transactional` behaviors that live there (ADR 0020).
seiva-cqrs = { version = "0.2.3", path = "../seiva-cqrs" }
# The verified caller: `Principal` and the `Authenticator` the authn middleware
# runs. Transport-free, so the same identity model serves HTTP and MCP (ADR 0006).
seiva-identity = { version = "0.2.3", path = "../seiva-identity" }
# The OpenAPI 3.1 generator: `/openapi.json` is generated from the facades
# linked into the binary, not hand-written. Data-layer-free like this crate.
seiva-openapi = { version = "0.2.3", path = "../seiva-openapi" }

axum = "0.8"
# The metrics FACADE only (ADR 0027): the request middleware records a counter,
# a latency histogram and an in-flight gauge against it. It is a no-op until the
# root installs a recorder (`seiva-observability`), so this stays DORM-free and
# zero-cost-when-unused — no exporter, no runtime is linked here.
metrics = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reports the keys a DTO ignored during deserialization so `Valid<T>` can reject
# unknown fields (OWASP API6 — mass assignment) without every DTO having to carry
# `#[serde(deny_unknown_fields)]`.
serde_ignored = "0.1"
# Canonical request fingerprint for idempotency (ADR 0011): SHA-256 over the
# scoped-key tuple and the request's canonical JSON. serde_json's default Map is
# a BTreeMap, so object keys serialise in sorted order — a stable fingerprint.
sha2 = "0.10"
# A failed audit write (ADR 0013) must not fail the request, but it must not pass
# silently either: it is logged at warn through the framework's tracing.
tracing = "0.1"
# CORS enforcement: the battle-tested tower layer rather than a hand-rolled
# preflight. Only the `cors` feature; the secure default mounts no layer at all.
tower-http = { version = "0.6", features = ["cors", "timeout"] }
# Per-route load control (`backpressure`): `time::timeout` bounds a route's
# latency (504) and a `sync::Semaphore` enforces its concurrency cap (503). The
# `rt` leaf adds only `tokio::task::spawn_blocking`, which the authn middleware
# uses to offload a CPU-bound JWT signature check off the async executor — the
# binary still provides the runtime; this just exposes the offload API. No
# executor/reactor is pulled into the DORM-free library beyond these leaves.
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }

# --- Optional: mutual TLS (`mtls` feature, ADR 0047) -------------------------
# The listener terminates TLS 1.3 itself and verifies each client certificate
# against the deployment's own CA, so a device/service identity becomes a
# `Principal` through the same `authn` middleware as a bearer token. OFF by
# default: a service behind a TLS-terminating proxy links none of this.
# rustls with the `ring` provider (no C toolchain, the provider the rest of the
# workspace's TLS tests already use); `tokio-rustls` drives the handshake.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"], optional = true }
# Reads the verified leaf's subject, SANs, serial and validity — the fields a
# `CertificateAuthenticator` maps to a `Principal`. Parsing only: the chain was
# already verified by rustls/webpki before this runs.
x509-parser = { version = "0.18", optional = true }
# The per-connection service the listener hands to `axum::serve`.
tower-service = { version = "0.3", optional = true }

[features]
# Mutual TLS: `seiva_http::mtls` (listener, config, client certificate,
# `CertificateAuthenticator`) and the client-certificate path of `authn`.
# `axum/http2`: the listener advertises ALPN `h2` + `http/1.1`, so `axum::serve`
# must speak HTTP/2 too; without it a client that negotiates `h2` (reqwest
# does) completes the handshake and is then dropped with no response.
mtls = ["axum/http2", "dep:rustls", "dep:tokio-rustls", "dep:x509-parser", "dep:tower-service", "tokio/net", "tokio/io-util"]

[dev-dependencies]
# Drives the router without a live server: `ServiceExt::oneshot`.
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util"] }
# A controllable `Clock` so the rate-limiter's window is tested without sleeping.
seiva-testing = { version = "0.2.3", path = "../seiva-testing" }
# A test double of `RateLimitStore` that errors, to exercise the fail-open /
# fail-closed policy on a store outage.
async-trait = { workspace = true }
# mTLS tests (feature `mtls`): rcgen mints a throwaway CA, server and client
# certificates; a real TCP listener and a tokio-rustls client drive the handshake.
rcgen = "0.13"
# `tls12` only here, so a test can prove a TLS 1.2 client is refused.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# An HTTP/2 client for the mTLS test that negotiates `h2` by ALPN, as reqwest
# does: proves the listener speaks the protocol it advertises.
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
