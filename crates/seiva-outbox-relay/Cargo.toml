# seiva-outbox-relay — the transactional-outbox → broker relay worker.
#
# The old dorm-messaging `OutboxBus`, re-homed in Seiva (Parte DORM-A; DORM ADR
# 0054): consuming the in-database outbox stays DORM's (dorm-outbox), and the
# relay loop that drives it and forwards through a seiva-messaging Publisher is
# the framework's. DORM is a pinned git dependency; like seiva-data-dorm this
# crate is excluded from the workspace until the `dorm` feature + a CI token are
# wired (the owner's call).
[package]
name = "seiva-outbox-relay"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
seiva-messaging = { path = "../seiva-messaging" }
# The framework's worker runtime (the loop/shutdown/metrics) and the boundary
# error type. `delonix-seiva` is data-layer-free, so no DORM feature is pulled.
delonix-seiva = { path = "../delonix-seiva", default-features = false }
seiva-ports = { path = "../seiva-ports" }
# DORM by published version (owner decision, roadmap P0-1). The root manifest
# that builds this crate (the gateway standalone, or the dorm-e2e app) carries the
# interim `[patch.crates-io]` redirecting these to the local DORM checkout until
# DORM publishes.
dorm-outbox = "0.1"
dorm-core = "0.6"
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

# INTERIM — remove once dorm-core/dorm-outbox are published to crates.io. Lets this
# excluded crate build standalone by redirecting the DORM crates to the local
# checkout beside Seiva (projects/DORM). When built as a dependency of the dorm-e2e
# app, that app's root `[patch]` governs instead and this one is ignored.
[patch.crates-io]
dorm-core = { path = "../../../DORM/crates/dorm-core" }
dorm-outbox = { path = "../../../DORM/crates/dorm-outbox" }
