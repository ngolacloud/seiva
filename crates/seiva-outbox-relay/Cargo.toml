# seiva-outbox-relay — the transactional-outbox → broker relay worker.
#
# The old dorm-messaging `OutboxBus`, re-homed in Seiva (Parte DORM-A; DORM ADR
# 0054): consuming the in-database outbox stays DORM's (dorm-outbox), and the
# relay loop that drives it and forwards through a seiva-messaging Publisher is
# the framework's. DORM is a pinned git dependency; like seiva-data-dorm this
# crate is excluded from the workspace until the `dorm` feature + a CI token are
# wired (the owner's call).
[package]
name = "seiva-outbox-relay"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
seiva-messaging = { path = "../seiva-messaging" }
# The framework's worker runtime (the loop/shutdown/metrics) and the boundary
# error type. `delonix-seiva` is data-layer-free, so no DORM feature is pulled.
delonix-seiva = { path = "../delonix-seiva", default-features = false }
seiva-ports = { path = "../seiva-ports" }
# The DORM-free in-process bus: the `OutboxReader` trait + `drain_in_process` driver
# this crate supplies a DORM adapter for. `default-features = false` drops the
# in-memory `InMemoryOutbox` double — the real reader here is the DORM one.
seiva-events = { path = "../seiva-events", default-features = false }
# To implement the `OutboxReader` (an `async-trait` trait) over DORM.
async-trait = "0.1"
# DORM by published version (owner decision, roadmap P0-1); resolved from crates.io.
dorm-outbox = "0.1"
dorm-core = "0.6"
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
# The in-memory idempotency double, so the gated live test can drive the driver's
# inbox without a DORM-backed store (the DORM store lives in seiva-data-dorm).
seiva-testing = { path = "../seiva-testing" }
