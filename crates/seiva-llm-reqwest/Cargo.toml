# seiva-llm-reqwest — the real `HttpTransport` for `seiva-llm` (ADR 0048, G1).
#
# `seiva-llm` builds and reads model requests but links no HTTP client; this
# crate puts them on the wire with reqwest over rustls. reqwest + rustls are
# heavy, so — like `apps/webhook-delivery-e2e` — the crate is EXCLUDED from the
# default workspace (root `exclude`) and built by its own CI job via
# `--manifest-path`. Nothing in the default `cargo check --workspace` links it.
[package]
name = "seiva-llm-reqwest"
version = "0.2.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["NgolaCloud <angolar.devops@gmail.com>"]
repository = "https://github.com/ngolacloud/seiva"
homepage = "https://github.com/ngolacloud/seiva"
rust-version = "1.75"
description = "The reqwest/rustls HttpTransport for seiva-llm: puts model requests on the wire, never follows a redirect, marks credential headers sensitive."
readme = "README.md"
keywords = ["llm", "reqwest", "seiva"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
# The port this crate implements.
seiva-llm = { version = "0.2.1", path = "../seiva-llm" }
# `default-features = false` + `rustls-tls` keeps it off native-tls/OpenSSL; the
# `stream` feature gives the body as it arrives, for server-sent events.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
# A real local HTTP server for the end-to-end test: axum on a bound port.
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde_json = "1"
