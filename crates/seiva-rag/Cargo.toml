# seiva-rag — retrieval with permissions, and answers that cite (ADR 0048, G6).
#
# A `VectorIndex` port whose only search takes an access filter (tenant and
# permissions, applied IN the query, never after it), an ingestor that refuses a
# document without provenance, a retriever that searches as the caller, and an
# answer that cites its sources — or says it has none. An in-memory index ships;
# `seiva-rag-pgvector` implements the same port on Postgres. DORM-free.
[package]
name = "seiva-rag"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Retrieval with permissions for Delonix Seiva: tenant and access filtered in the query, provenance required at ingestion, answers that cite their sources."
readme = "README.md"
keywords = ["rag", "retrieval", "llm", "seiva"]
categories = ["asynchronous"]

[features]
default = ["agent"]
# A `search_documents` tool for `seiva-agent`.
agent = ["dep:seiva-agent"]

[dependencies]
seiva-llm = { version = "0.2.3", path = "../seiva-llm", default-features = false }
seiva-ai-gateway = { version = "0.2.3", path = "../seiva-ai-gateway" }
seiva-identity = { version = "0.2.3", path = "../seiva-identity" }
seiva-agent = { version = "0.2.3", path = "../seiva-agent", default-features = false, optional = true }
seiva = { workspace = true, optional = false }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "perf"] }
sha2 = "0.10"

[dev-dependencies]
seiva-testing = { workspace = true, features = ["llm"] }
tokio = { workspace = true, features = ["rt", "macros"] }

[[test]]
name = "rag"
required-features = ["agent"]
