# seiva-data-dorm — the DORM data-layer gateway (Parte C; Seiva ADR 0004).
#
# ALL coupling to DORM lives in this one crate (the Gateway pattern): the rest of
# Seiva knows only `seiva-ports`. Switching the DORM data layer off is not
# compiling this crate. It depends on DORM by a pinned git revision (the brief's
# rule until DORM publishes the library API), never by local path.
#
# Deliberately NOT a member of the Seiva workspace yet: building it needs access
# to the private DORM repo, which the public CI does not have without a token.
# It is built on its own to prove the boundary crossing until the framework's
# `dorm` feature wires it in (owner decision: CI token + build coupling).
[package]
name = "seiva-data-dorm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
seiva-ports = { path = "../seiva-ports" }
# DORM by pinned git revision (main @ the merged DORM-C + B1 + B2 campaign).
dorm-core = { git = "https://github.com/ngolacloud/dorm", rev = "f43d8738e37e054669a9a6ac8971c0af57717191" }
# The transactional outbox: EventPublisher writes the event here in the same
# transaction as the business change (dorm-outbox stays in DORM — the data layer).
dorm-outbox = { git = "https://github.com/ngolacloud/dorm", rev = "f43d8738e37e054669a9a6ac8971c0af57717191" }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
async-trait = "0.1"
