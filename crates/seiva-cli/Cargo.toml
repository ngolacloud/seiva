# seiva-cli — the installable CLI, binary `seiva`.
#
# Scaffolds projects and modules, runs the dev loop, and lints the architecture.
# Like DORM's `dorm` binary, every command is a thin layer over a public library
# function with a typed result; this crate only reads arguments and environment
# and calls them. The command tree is declared here from day one so the shape is
# reviewable; subcommands that are not built yet report that honestly instead of
# faking success.
[package]
name = "seiva-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "The Delonix Seiva CLI (binary `seiva`): scaffold projects and modules, run the dev loop, lint the architecture."
# Not published yet: the demo commands (`user create`, built-in `openapi`/`proto`)
# depend on the example crates (`notes-*`, `accounts-*`, all publish = false).
# Install meanwhile with `cargo install --git https://github.com/ngolacloud/seiva
# seiva-cli`. Generated projects do NOT depend on the CLI, so this does not block
# them. Publishing it to crates.io is gated on extracting those demo commands
# (see docs/publishing.md).
publish = false

[[bin]]
name = "seiva"
path = "src/main.rs"

[dependencies]
delonix-seiva = { workspace = true }
clap = { workspace = true }
# DORM-free sibling crates the new `openapi`/`proto`/`user` commands drive. Path
# deps (siblings), kept out of the `dorm` feature: these commands never touch the
# data layer, so they must build with default features and `--no-default-features`
# alike.
seiva-openapi = { path = "../seiva-openapi" }
seiva-grpc = { path = "../seiva-grpc" }
# The built-in demonstration facade the CLI documents at compile time.
notes-facade = { path = "../../examples/notes/facade" }
serde_json = "1"
# `seiva user create` drives the real `accounts` module use case (the CLI is the
# application/composition layer): it builds an AccountsService over the in-memory
# repository and in-process ports. The module hashes with seiva-auth internally,
# so the CLI no longer depends on seiva-auth directly.
accounts-facade = { path = "../../examples/accounts/facade" }
accounts-application = { path = "../../examples/accounts/application" }
accounts-infrastructure = { path = "../../examples/accounts/infrastructure" }
accounts-interface = { path = "../../examples/accounts/interface" }
seiva-ports = { workspace = true }
async-trait = { workspace = true }
# A current-thread runtime to drive the module's async use case from the sync CLI.
tokio = { version = "1", features = ["rt"] }

[features]
# Forward the data-layer toggle to the framework crate so `--no-default-features`
# on the binary genuinely links a DORM-free build (provable via `seiva doctor`).
default = ["dorm"]
dorm = ["delonix-seiva/dorm"]
