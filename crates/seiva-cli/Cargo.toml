# seiva-cli — the installable CLI, binary `seiva`.
#
# Scaffolds projects and modules, runs the dev loop, and lints the architecture.
# Like DORM's `dorm` binary, every command is a thin layer over a public library
# function with a typed result; this crate only reads arguments and environment
# and calls them. The command tree is declared here from day one so the shape is
# reviewable; subcommands that are not built yet report that honestly instead of
# faking success.
[package]
name = "seiva-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "The Delonix Seiva CLI (binary `seiva`): scaffold projects and modules, run the dev loop, lint the architecture."

[[bin]]
name = "seiva"
path = "src/main.rs"

[dependencies]
seiva = { workspace = true }
# The architecture lint, extracted into its own crate (also the `cargo seiva`
# subcommand). `seiva lint` delegates to it.
cargo-seiva = { workspace = true }
clap = { workspace = true }
serde_json = "1"
# Demonstration-only, behind the `demo` feature (default off). Both are published
# to crates.io, so their `version` lets `cargo publish` resolve them even though
# the feature is off by default — unlike the `examples/` crates (`notes-*`,
# `accounts-*`), which are `publish = false` and so cannot be dependencies of a
# publishable crate (even optional path deps block `cargo publish`). The demo
# facade and user-create are therefore self-contained in `src/demo.rs`, built
# only from these published crates. See docs/publishing.md.
seiva-openapi = { path = "../seiva-openapi", version = "0.1.0", optional = true }
seiva-auth = { path = "../seiva-auth", version = "0.1.0", optional = true }

[features]
# Forward the data-layer toggle to the framework crate so `--no-default-features`
# on the binary genuinely links a DORM-free build (provable via `seiva doctor`).
default = ["dorm"]
dorm = ["seiva/dorm"]
# The built-in demonstration commands (`seiva openapi`/`user create` outside a
# project). Off in the published binary; a project's own `openapi`/`proto` work
# without it. `cargo install seiva-cli --features demo` turns them on.
demo = ["dep:seiva-openapi", "dep:seiva-auth"]
