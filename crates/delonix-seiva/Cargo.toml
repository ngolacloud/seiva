# delonix-seiva — the framework crate downstream applications depend on.
#
# The public entrypoint of Delonix Seiva. Re-exports the ports and, as the
# framework grows, the HTTP/gRPC runtime, the application-layer command/query
# dispatch, the worker runtime and the macros. The DORM data layer is NOT a
# dependency here: it enters only through the separate `seiva-data-dorm` gateway
# behind the `dorm` feature (ADR 0001, decision 5).
[package]
name = "delonix-seiva"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Delonix Seiva — a Rust backend framework for robust, high-criticality systems. Only backend; DORM as the default data layer."

[dependencies]
seiva-ports = { workspace = true }
seiva-macros = { workspace = true }
serde = { workspace = true }
# The wire-schema contribution (`WireSchema`) returns a JSON Schema fragment as a
# `serde_json::Value`, re-exported so `#[derive(WireSchema)]` output can name it.
serde_json = "1"
toml = { workspace = true }
thiserror = { workspace = true }
# Link-time facade discovery: `#[seiva::facade]` submits each descriptor into an
# inventory the runtime collects, so `/openapi.json` lists every mounted facade
# with no central registry to keep in sync (closes OWASP API9).
inventory = "0.3"
# The worker runtime's loop needs an interval and select; `tracing` is a facade
# (no subscriber installed = near-zero cost), for the worker's metrics spans.
tokio = { workspace = true, features = ["time", "macros"] }
tracing = "0.1"

[dev-dependencies]
# The worker tests drive the loop on a current-thread runtime and signal
# shutdown over a oneshot.
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }

[features]
# DORM wired in by default, but as a feature so a project whose every module
# uses an external data layer can switch it off and pull in no ORM at all. The
# gateway crate that the feature will pull in (`seiva-data-dorm`) does not exist
# yet; the flag is declared here now so the boundary is visible from day one.
default = ["dorm"]
dorm = []
