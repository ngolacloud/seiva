# seiva-server — the Delonix Seiva service runtime ("the main a module installs").
#
# Boots a Seiva service: mounts the facade-driven HTTP application (controllers +
# `/openapi.json` + `/health`) from `seiva-http`, runs a background worker host on
# the `seiva` worker runtime, reads 12-factor configuration from the
# environment with `seiva-config`, and shuts down gracefully on Ctrl-C / SIGTERM.
# It replaces DORM's old `dorm-api`.
#
# DORM-FREE, and load-bearing for CI: this crate depends on NO `dorm-*` crate and
# on NO excluded Seiva crate (`seiva-data-dorm`, `seiva-outbox-relay`,
# `seiva-rag-worker`, `seiva-mcp`). It declares NO cargo feature that could pull
# any of them in, so `cargo clippy --all-targets --all-features` stays buildable
# without the private DORM repo token. The real transactional-outbox relay pass is
# injected here behind the framework's `dorm` feature once that token exists; see
# `run_workers` in `src/lib.rs`.

[package]
name = "seiva-server"
version = "0.2.2"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["NgolaCloud <angolar.devops@gmail.com>"]
repository = "https://github.com/ngolacloud/seiva"
homepage = "https://github.com/ngolacloud/seiva"
rust-version = "1.75"
description = "Delonix Seiva — the service runtime: mounts the facade-driven HTTP app, runs a worker host, reads 12-factor config, shuts down gracefully. DORM-free."
keywords = ["server", "runtime", "web", "backend", "framework"]
categories = ["web-programming::http-server"]

[features]
# Native observability (ADR 0027), wired ONLY here at the composition root so the
# default build links no exporter and pays nothing. `metrics` serves a Prometheus
# `/metrics` scrape surface on a separate bind (`Server::with_metrics`);
# `tracing-otlp` installs the OpenTelemetry OTLP span exporter
# (`Server::with_tracing`). Named `tracing-otlp` (not `tracing`) to avoid clashing
# with the `tracing` crate dependency.
default = []
metrics = ["dep:seiva-observability", "seiva-observability/metrics"]
tracing-otlp = ["dep:seiva-observability", "seiva-observability/tracing"]
# Mutual TLS terminated by the service itself (ADR 0047): `serve_router_mtls`
# and the `SEIVA_TLS_*` configuration. Off by default — a service behind a
# TLS-terminating proxy keeps `serve_router`.
mtls = ["seiva-http/mtls"]

[dependencies]
# The HTTP transport: `router(health)` already merges the controllers, the health
# endpoints and `/openapi.json`; `Health` is the Starting/Ready/Draining handle.
seiva-http = { version = "0.2.2", path = "../seiva-http" }
# The opt-in observability exporters (ADR 0027), pulled in only by the `metrics` /
# `tracing-otlp` features above. default-features OFF so each feature turns on
# exactly the exporter it needs. DORM-free, like the rest of this crate.
seiva-observability = { version = "0.2.2", path = "../seiva-observability", default-features = false, optional = true }
# Typed 12-factor configuration + the AppEnv production-safety guard.
seiva-config = { version = "0.2.2", path = "../seiva-config" }
# The framework crate: its worker runtime (`worker::run_worker`) drives the host.
# default-features = false keeps the `dorm` toggle off (the data layer stays out).
seiva = { version = "0.2.2", path = "../seiva", default-features = false }

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros", "sync"] }
# Structured logging to stdout (12-factor: logs are an event stream). `json` for
# machine-parseable lines, `env-filter` to honour RUST_LOG.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
# Drives the router without a live server: `ServiceExt::oneshot`.
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
# The `accounts` example composition, exercised in tests only — the runtime
# itself ships demo-free. Dev-dependencies on example crates are stripped on
# publish, so they do not block it.
accounts-interface = { path = "../../examples/accounts/interface" }
accounts-infrastructure = { path = "../../examples/accounts/infrastructure" }
# In-memory port doubles to drive the idempotency-purge worker without a database.
seiva-testing = { version = "0.2.2", path = "../seiva-testing" }
# `serve_router_mtls` end to end (feature `mtls`): throwaway PKI and a TLS client.
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
