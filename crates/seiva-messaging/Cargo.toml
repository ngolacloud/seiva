# seiva-messaging — the framework's messaging layer, moved out of DORM with its
# git history (brief's Parte DORM-A; DORM ADR 0054). A CloudEvents 1.0 envelope,
# a Publisher trait, and broker backends behind features. Data-layer-free: it
# carries bytes to a broker and never touches a database.
[package]
name = "seiva-messaging"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Messaging for Delonix Seiva: a CloudEvents 1.0 envelope, a Publisher trait, and broker backends (NATS, AMQP, Kafka) behind features. Data-layer-free."
readme = "README.md"
keywords = ["messaging", "cloudevents", "nats", "kafka", "amqp"]
categories = ["asynchronous"]

[dependencies]
serde_json = "1"
tracing = "0.1"
# The NATS backend's client, pulled only when the `nats` feature is on (ADR 0051).
async-nats = { version = "0.51", optional = true }
# The AMQP backend's client (RabbitMQ and any AMQP 0-9-1 broker), only with `amqp` (ADR 0052).
lapin = { version = "4", optional = true }
# The Kafka backend's client — pure-Rust `rskafka` (no librdkafka/C), only with `kafka` (ADR 0053).
rskafka = { version = "0.6", optional = true }
# The Kafka backend stamps a record time with `rskafka::chrono::Utc::now()`, which
# needs chrono's `clock` feature. In the DORM workspace another crate enabled it;
# here we enable it ourselves (gated to `kafka`) so the shared chrono has `now`.
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }

[features]
default = []
# Broker backends land behind features so a build that uses none pulls no client
# library. NATS (ADR 0051), AMQP (ADR 0052) and Kafka (ADR 0053) each behind its feature.
nats = ["dep:async-nats"]
kafka = ["dep:rskafka", "dep:chrono"]
amqp = ["dep:lapin"]
