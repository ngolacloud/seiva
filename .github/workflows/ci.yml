name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One in-flight run per ref: a new push cancels the previous run on the same
# branch or PR, so the queue never backs up on force-pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate: format, lint, and the whole test suite — no database and no broker,
  # because the framework's tests run against the in-memory doubles in
  # `seiva-testing`. The `seiva lint` fitness functions are unit-tested here as
  # part of `delonix-seiva`.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        run: rustup toolchain install stable --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace
      # Opt-in features whose tests the default build compiles out. `mtls`
      # (ADR 0047) runs real TLS 1.3 handshakes against a throwaway PKI.
      - name: Test (feature mtls)
        run: cargo test -p seiva-http -p seiva-server --features seiva-http/mtls,seiva-server/mtls
      # The model doubles (ADR 0048) sit behind seiva-testing's `llm` feature.
      - name: Test (seiva-testing feature llm)
        run: cargo test -p seiva-testing --features llm
      # The gateway's server shape (ADR 0048 G3) sits behind its `server` feature.
      - name: Test (seiva-ai-gateway feature server)
        run: cargo test -p seiva-ai-gateway --features server
      - name: Smoke-test the CLI
        run: cargo run -q -p seiva-cli --bin seiva -- doctor

  # The CVE/KEV and supply-chain gate: cargo-deny's `advisories` check IS the
  # RUSTSEC scan (a superset of cargo-audit) and is feature-aware, so it gates on
  # exactly what a build pulls. Config in /deny.toml.
  #
  # Two HARD passes (both must be clean):
  #   1. DEFAULT features — what a Seiva service ships.
  #   2. ALL features — everything, including seiva-messaging's OPTIONAL broker
  #      backends (nats/amqp/kafka). Clean since their clients were bumped, so
  #      this is a hard gate too (no exceptions on file).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        run: rustup toolchain install stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo-deny — default build
        run: cargo deny check
      - name: cargo-deny — all features (incl. optional broker backends)
        run: cargo deny --all-features check

  # Documentation builds with intra-doc links treated as errors, matching DORM's
  # gate: a redundant or dangling `[`link`]` fails here rather than shipping.
  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the docs
        run: cargo doc --no-deps --workspace --document-private-items

  # The three reference data-layer adapters (ADR 0030): DORM (the default), sqlx
  # and SeaORM. Each implements the `seiva-ports` service ports over the ambient
  # scope-based transaction; each is EXCLUDED from the workspace (so the gate above
  # stays ORM-free) and built here in a matrix. All three are DORM-free to resolve
  # — the DORM gateway depends on the PUBLISHED `dorm-core`/`dorm-outbox` from
  # crates.io, so this job needs no token (unlike `dorm-gateway` below, which also
  # builds the git-coupled relay/RAG/MCP companions). A Postgres service backs the
  # live round-trips, which are env-gated per adapter and skip when the DSN is
  # unset — so the offline fmt/clippy/build still pass without a database.
  adapters:
    name: adapter (${{ matrix.adapter }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seiva_adapters
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # The three DSNs point at the one Postgres service; each adapter's live tests
    # read only their own var (the others are inert for that leg), so setting all
    # three for every leg is harmless and keeps the env keys literal (GitHub Actions
    # does not allow an expression in an env KEY). DORM takes a libpq-style DSN
    # (tokio-postgres); sqlx and SeaORM take a URL.
    env:
      SEIVA_DORM_TEST_DSN: "host=localhost port=5432 user=postgres password=postgres dbname=seiva_adapters sslmode=disable"
      SEIVA_SQLX_TEST_DSN: "postgres://postgres:postgres@localhost:5432/seiva_adapters"
      SEIVA_SEAORM_TEST_DSN: "postgres://postgres:postgres@localhost:5432/seiva_adapters"
    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: dorm
            manifest: crates/seiva-data-dorm/Cargo.toml
          - adapter: sqlx
            manifest: crates/seiva-data-sqlx/Cargo.toml
          - adapter: seaorm
            manifest: crates/seiva-data-seaorm/Cargo.toml
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        run: rustup toolchain install stable --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.manifest }}
      - name: Format
        run: cargo fmt --manifest-path "${{ matrix.manifest }}" --all --check
      - name: Lint
        run: cargo clippy --manifest-path "${{ matrix.manifest }}" --all-targets --all-features -- -D warnings
      - name: Test (live round-trips via the Postgres service)
        # Serialize: the live tests each create/drop shared tables on one Postgres.
        run: cargo test --manifest-path "${{ matrix.manifest }}" --all-features -- --test-threads=1

  # The ADR 0033 delivery end-to-end proof: the REAL reqwest/TLS `HttpSender`
  # adapter + an e2e that enqueues via the subscriber and delivers over a LOCAL
  # HTTPS server (rcgen self-signed cert). It is DORM-FREE (so it needs NO token
  # and NO database) but EXCLUDED from the workspace because reqwest + rustls + a
  # TLS test server are heavy; the `check` gate above stays http-client-free. Built
  # here standalone via `--manifest-path`, exactly like the adapter legs.
  webhook-delivery-e2e:
    name: webhook-delivery-e2e
    runs-on: ubuntu-latest
    env:
      MANIFEST: apps/webhook-delivery-e2e/Cargo.toml
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        run: rustup toolchain install stable --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.MANIFEST }}
      - name: Format
        run: cargo fmt --manifest-path "$MANIFEST" --all --check
      - name: Lint
        run: cargo clippy --manifest-path "$MANIFEST" --all-targets --all-features -- -D warnings
      - name: Test (sign + POST over a local HTTPS server → Delivered)
        run: cargo test --manifest-path "$MANIFEST" --all-features

  # The real reqwest/rustls `HttpTransport` for `seiva-llm` (ADR 0048, G1) and its
  # end-to-end proof: the codecs and the router over real HTTP against a local
  # axum server (whole and streamed answers, a 401, a redirect that is not
  # followed, a fallback from an overloaded upstream). DORM-free, but EXCLUDED
  # from the workspace because reqwest + rustls are heavy — the `check` gate above
  # stays http-client-free. Its own lockfile is audited here.
  llm-reqwest:
    name: llm-reqwest
    runs-on: ubuntu-latest
    env:
      MANIFEST: crates/seiva-llm-reqwest/Cargo.toml
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        run: rustup toolchain install stable --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/seiva-llm-reqwest
      - name: Format
        run: cargo fmt --manifest-path "$MANIFEST" --all --check
      - name: Lint
        run: cargo clippy --manifest-path "$MANIFEST" --all-targets --all-features -- -D warnings
      - name: Test (real HTTP round trips against a local server)
        run: cargo test --manifest-path "$MANIFEST" --all-features
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo-deny — the excluded lockfile
        run: cargo deny --manifest-path "$MANIFEST" check advisories bans licenses sources

  # The runnable AI gateway (ADR 0048, G3): one TOML file → the OpenAI- and
  # Anthropic-compatible endpoints on seiva-server. The end-to-end test builds the
  # app from a TOML file and calls it over real HTTP with clients of both shapes,
  # against a fake upstream (masking, keys, streaming, health). Excluded from the
  # workspace like `llm-reqwest` (reqwest + rustls); its lockfile is audited here.
  ai-gateway:
    name: ai-gateway
    runs-on: ubuntu-latest
    env:
      MANIFEST: apps/ai-gateway/Cargo.toml
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        run: rustup toolchain install stable --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/ai-gateway
      - name: Format
        run: cargo fmt --manifest-path "$MANIFEST" --all --check
      - name: Lint
        run: cargo clippy --manifest-path "$MANIFEST" --all-targets --all-features -- -D warnings
      - name: Test (the app over real HTTP, both client shapes)
        run: cargo test --manifest-path "$MANIFEST" --all-features
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo-deny — the excluded lockfile
        run: cargo deny --manifest-path "$MANIFEST" check advisories bans licenses sources

  # The git-coupled crates (the DORM data-layer gateway and its relay/RAG/MCP
  # companions) are EXCLUDED from the workspace, so the jobs above stay DORM-free
  # and need no credentials. This job builds and tests them against the private
  # DORM repo — but ONLY when a `DORM_TOKEN` repository secret is configured.
  # Without the secret every step after the gate is skipped and the job is a
  # green no-op, so the gate never hangs on a secret that is not there. To
  # activate: add a `DORM_TOKEN` Actions secret (a token with read access to
  # github.com/ngolacloud/dorm — a fine-grained PAT or a GitHub App token); the
  # next run then proves the DORM boundary crossing end to end.
  dorm-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect the DORM access token
        id: gate
        env:
          DORM_TOKEN: ${{ secrets.DORM_TOKEN }}
        run: |
          if [ -n "$DORM_TOKEN" ]; then
            echo "DORM_TOKEN present — building the git-coupled crates."
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "DORM_TOKEN absent — skipping. Add the secret to build the DORM gateway."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the toolchain
        if: steps.gate.outputs.present == 'true'
        run: rustup toolchain install stable --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.present == 'true'
      - name: Install cargo-deny
        if: steps.gate.outputs.present == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Authenticate cargo to the private DORM repo
        if: steps.gate.outputs.present == 'true'
        env:
          DORM_TOKEN: ${{ secrets.DORM_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${DORM_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      - name: Build, lint and test the git-coupled crates
        if: steps.gate.outputs.present == 'true'
        env:
          # DORM is fetched by git revision; the CLI transport carries the auth
          # the `insteadOf` rewrite configured above.
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          set -euo pipefail
          for crate in seiva-data-dorm seiva-outbox-relay seiva-rag-worker seiva-mcp; do
            echo "::group::$crate"
            cargo fmt --manifest-path "crates/$crate/Cargo.toml" --all --check
            cargo clippy --manifest-path "crates/$crate/Cargo.toml" --all-targets --all-features -- -D warnings
            cargo test --manifest-path "crates/$crate/Cargo.toml" --all-features
            echo "::endgroup::"
          done
      # The RustSec advisory gate for the DORM-coupled lockfiles (§9): the
      # workspace `audit` job never sees DORM's tree, so audit each excluded
      # crate's lockfile here, where DORM resolves. Tracked exceptions live in
      # `deny.excluded.toml` (with reasons + a review date), so a NEW advisory in
      # DORM's tree fails this gate instead of hiding.
      - name: cargo-deny — advisories for the DORM-coupled lockfiles
        if: steps.gate.outputs.present == 'true'
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          set -euo pipefail
          for crate in crates/seiva-data-dorm crates/seiva-outbox-relay \
                       crates/seiva-rag-worker crates/seiva-mcp apps/dorm-e2e \
                       apps/admin-data-e2e; do
            echo "::group::deny $crate"
            cargo deny --manifest-path "$crate/Cargo.toml" \
              --config deny.excluded.toml check advisories
            echo "::endgroup::"
          done

  # The DORM end-to-end proof (`apps/dorm-e2e`): the real "main" composing the
  # gateway, the transactional-outbox relay and the HTTP server over real DORM
  # — the `dorm` feature path end to end. Like `dorm-gateway` it is token-gated
  # (a green no-op without `DORM_TOKEN`), keeping the default build credential-
  # free. The offline gates here prove compilation/linking and the no-DB logic;
  # a live-Postgres integration test is a later increment.
  dorm-e2e:
    runs-on: ubuntu-latest
    # A real Postgres so the live integration test exercises the accounts
    # persistence round-trip (and the outbox relay) end to end. The database
    # must pre-exist (`connect` does not create it); the tests create their own
    # tables (`CREATE TABLE IF NOT EXISTS`). The test is env-gated on
    # DORM_TEST_DSN, so it only runs here, never in the offline gates.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dorm_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Detect the DORM access token
        id: gate
        env:
          DORM_TOKEN: ${{ secrets.DORM_TOKEN }}
        run: |
          if [ -n "$DORM_TOKEN" ]; then
            echo "DORM_TOKEN present — building the DORM end-to-end app."
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "DORM_TOKEN absent — skipping. Add the secret to build apps/dorm-e2e."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the toolchain
        if: steps.gate.outputs.present == 'true'
        run: rustup toolchain install stable --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.present == 'true'
      - name: Authenticate cargo to the private DORM repo
        if: steps.gate.outputs.present == 'true'
        env:
          DORM_TOKEN: ${{ secrets.DORM_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${DORM_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      - name: Build, lint and test the DORM end-to-end app
        if: steps.gate.outputs.present == 'true'
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          # The live integration test connects here; the service above created
          # the `dorm_e2e` database. Absent this var the test would skip.
          DORM_TEST_DSN: "host=localhost port=5432 user=postgres password=postgres dbname=dorm_e2e sslmode=disable"
        run: |
          set -euo pipefail
          cargo fmt --manifest-path apps/dorm-e2e/Cargo.toml --all --check
          cargo clippy --manifest-path apps/dorm-e2e/Cargo.toml --all-targets --all-features -- -D warnings
          # Serialize: the live tests each create tables, and concurrent
          # CREATE TABLE IF NOT EXISTS on one Postgres races.
          cargo test --manifest-path apps/dorm-e2e/Cargo.toml --all-features -- --test-threads=1
      - name: Build, lint and test the data-layer admin app (Catalog CRUD)
        if: steps.gate.outputs.present == 'true'
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          # The live CRUD round-trip connects here (same Postgres service); absent
          # this var the test skips.
          SEIVA_DORM_TEST_DSN: "host=localhost port=5432 user=postgres password=postgres dbname=dorm_e2e sslmode=disable"
        run: |
          set -euo pipefail
          cargo fmt --manifest-path apps/admin-data-e2e/Cargo.toml --all --check
          cargo clippy --manifest-path apps/admin-data-e2e/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path apps/admin-data-e2e/Cargo.toml --all-features -- --test-threads=1
