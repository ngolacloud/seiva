name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One in-flight run per ref: a new push cancels the previous run on the same
# branch or PR, so the queue never backs up on force-pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate: format, lint, and the whole test suite — no database and no broker,
  # because the framework's tests run against the in-memory doubles in
  # `seiva-testing`. The `seiva lint` fitness functions are unit-tested here as
  # part of `delonix-seiva`.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        run: rustup toolchain install stable --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Smoke-test the CLI
        run: cargo run -q -p seiva-cli --bin seiva -- doctor

  # Documentation builds with intra-doc links treated as errors, matching DORM's
  # gate: a redundant or dangling `[`link`]` fails here rather than shipping.
  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the docs
        run: cargo doc --no-deps --workspace --document-private-items

  # The git-coupled crates (the DORM data-layer gateway and its relay/RAG/MCP
  # companions) are EXCLUDED from the workspace, so the jobs above stay DORM-free
  # and need no credentials. This job builds and tests them against the private
  # DORM repo — but ONLY when a `DORM_TOKEN` repository secret is configured.
  # Without the secret every step after the gate is skipped and the job is a
  # green no-op, so the gate never hangs on a secret that is not there. To
  # activate: add a `DORM_TOKEN` Actions secret (a token with read access to
  # github.com/ngolacloud/dorm — a fine-grained PAT or a GitHub App token); the
  # next run then proves the DORM boundary crossing end to end.
  dorm-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect the DORM access token
        id: gate
        env:
          DORM_TOKEN: ${{ secrets.DORM_TOKEN }}
        run: |
          if [ -n "$DORM_TOKEN" ]; then
            echo "DORM_TOKEN present — building the git-coupled crates."
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "DORM_TOKEN absent — skipping. Add the secret to build the DORM gateway."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the toolchain
        if: steps.gate.outputs.present == 'true'
        run: rustup toolchain install stable --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.present == 'true'
      - name: Authenticate cargo to the private DORM repo
        if: steps.gate.outputs.present == 'true'
        env:
          DORM_TOKEN: ${{ secrets.DORM_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${DORM_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      - name: Build, lint and test the git-coupled crates
        if: steps.gate.outputs.present == 'true'
        env:
          # DORM is fetched by git revision; the CLI transport carries the auth
          # the `insteadOf` rewrite configured above.
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          set -euo pipefail
          for crate in seiva-data-dorm seiva-outbox-relay seiva-rag-worker seiva-mcp; do
            echo "::group::$crate"
            cargo fmt --manifest-path "crates/$crate/Cargo.toml" --all --check
            cargo clippy --manifest-path "crates/$crate/Cargo.toml" --all-targets --all-features -- -D warnings
            cargo test --manifest-path "crates/$crate/Cargo.toml" --all-features
            echo "::endgroup::"
          done

  # The DORM end-to-end proof (`apps/dorm-e2e`): the real "main" composing the
  # gateway, the transactional-outbox relay and the HTTP server over real DORM
  # — the `dorm` feature path end to end. Like `dorm-gateway` it is token-gated
  # (a green no-op without `DORM_TOKEN`), keeping the default build credential-
  # free. The offline gates here prove compilation/linking and the no-DB logic;
  # a live-Postgres integration test is a later increment.
  dorm-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect the DORM access token
        id: gate
        env:
          DORM_TOKEN: ${{ secrets.DORM_TOKEN }}
        run: |
          if [ -n "$DORM_TOKEN" ]; then
            echo "DORM_TOKEN present — building the DORM end-to-end app."
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "DORM_TOKEN absent — skipping. Add the secret to build apps/dorm-e2e."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the toolchain
        if: steps.gate.outputs.present == 'true'
        run: rustup toolchain install stable --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.present == 'true'
      - name: Authenticate cargo to the private DORM repo
        if: steps.gate.outputs.present == 'true'
        env:
          DORM_TOKEN: ${{ secrets.DORM_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${DORM_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      - name: Build, lint and test the DORM end-to-end app
        if: steps.gate.outputs.present == 'true'
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          set -euo pipefail
          cargo fmt --manifest-path apps/dorm-e2e/Cargo.toml --all --check
          cargo clippy --manifest-path apps/dorm-e2e/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path apps/dorm-e2e/Cargo.toml --all-features
