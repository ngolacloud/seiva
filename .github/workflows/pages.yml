name: pages

# Builds and publishes the Delonix Seiva documentation to GitHub Pages:
#   * the written guides (mkdocs-material, Django-styled) served at the root;
#   * the Rust API documentation (rustdoc) served under /api/.
#
# The `configure-pages` step self-enables Pages (`enablement: true`) using the
# workflow token, so no manual setup is normally needed. If org policy forbids
# a workflow from enabling Pages, do it once by hand — Settings → Pages → Build
# and deployment → Source: "GitHub Actions" — then re-run this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for Pages deployment via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; never cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the documentation toolchain
        run: pip install mkdocs-material pymdown-extensions mkdocs-static-i18n

      - name: Install the Rust toolchain
        run: rustup toolchain install stable
      - uses: Swatinem/rust-cache@v2

      # DORM-free: the default workspace excludes the DORM-coupled crates, so the
      # public docs build with no credentials.
      - name: Build the API docs (rustdoc)
        run: cargo doc --no-deps --workspace

      - name: Build the documentation site (mkdocs)
        run: mkdocs build

      - name: Fold the rustdoc into the site under /api/
        run: |
          mkdir -p site/api
          cp -r target/doc/* site/api/
          # Pages serves no directory listing without an index; redirect /api/
          # to the framework crate's rustdoc landing.
          cat > site/api/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=delonix_seiva/index.html">
            <link rel="canonical" href="delonix_seiva/index.html">
            <title>Delonix Seiva — API reference</title>
          </head>
          <body>
            <p>Redirecting to the <a href="delonix_seiva/index.html">Delonix Seiva API reference</a>…</p>
          </body>
          </html>
          HTML
          echo "rustdoc folded into site/api/"

      - uses: actions/configure-pages@v5
        with:
          # Create/enable the Pages site (Actions build type) if it does not
          # exist yet, so the first run provisions it instead of failing.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
