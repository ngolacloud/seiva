# dorm-e2e — the end-to-end proof of Seiva's `dorm` feature path.
#
# This crate composes the REAL DORM gateway (`seiva-data-dorm`), the
# transactional-outbox → broker relay worker (`seiva-outbox-relay`) and the HTTP
# server (`seiva-server`) into one runnable `main`, proving the whole write →
# outbox → relay path links and runs against the real `dorm-core`/`dorm-outbox`
# (pinned by git revision).
#
# It IS DORM-coupled and therefore EXCLUDED from the default Seiva workspace (the
# public CI has no token for the private DORM repo). A dedicated, token-gated CI
# job builds and tests it. The `[workspace]` table at the bottom is TEMPORARY: it
# lets the crate build standalone today. The orchestrator removes it and instead
# lists this crate in the repo-root `exclude`, exactly like the other DORM-coupled
# siblings (`seiva-data-dorm`, `seiva-outbox-relay`), which carry no `[workspace]`
# table of their own.
[package]
name = "dorm-e2e"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "dorm-e2e"
path = "src/main.rs"

[dependencies]
# The DORM gateway: connect + the four ports (Clock, IdGenerator, UnitOfWork,
# EventPublisher) and DormConfig. All DORM coupling for the ports lives here.
seiva-data-dorm = { path = "../../crates/seiva-data-dorm" }
# The transactional-outbox → broker relay worker (the headline path).
seiva-outbox-relay = { path = "../../crates/seiva-outbox-relay" }
# The DORM-free HTTP server (health endpoints, graceful drain).
seiva-server = { path = "../../crates/seiva-server" }
# The CloudEvents envelope + the Publisher trait the relay forwards through.
seiva-messaging = { path = "../../crates/seiva-messaging" }
# The framework's worker runtime (WorkerConfig/WorkerReport). Data-layer-free,
# so default features (the `dorm` flag) are off here.
delonix-seiva = { path = "../../crates/delonix-seiva", default-features = false }
# The accounts example use case the DORM gateway must satisfy.
accounts-application = { path = "../../examples/accounts/application" }
accounts-domain = { path = "../../examples/accounts/domain" }
# The trait-only boundary (BoxError, PortResult, the ports).
seiva-ports = { path = "../../crates/seiva-ports" }
# DORM used DIRECTLY: raw SQL (db::run/db::fetch/Value/Row) for the real
# repository, and RelayConfig for the relay worker. Same url + rev as the gateway.
dorm-core = { git = "https://github.com/ngolacloud/dorm", rev = "f43d8738e37e054669a9a6ac8971c0af57717191" }
dorm-outbox = { git = "https://github.com/ngolacloud/dorm", rev = "f43d8738e37e054669a9a6ac8971c0af57717191" }
tokio = { version = "1", features = ["rt-multi-thread", "signal", "macros", "net", "sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde_json = "1"
# The Argon2id verifier the live-Postgres test checks the stored PHC hash with.
seiva-auth = { path = "../../crates/seiva-auth" }
# The accounts module's public DTO, used to prove the value crossing the boundary
# carries no plaintext credential (it structurally has only id + username).
accounts-facade = { path = "../../examples/accounts/facade" }
