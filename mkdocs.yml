site_name: Delonix Seiva
site_url: https://ngolacloud.github.io/seiva/
site_description: >-
  A Rust backend framework for robust, high-criticality systems — ergonomic and
  batteries-included, as one compiled, no-GC binary.
repo_url: https://github.com/ngolacloud/seiva
repo_name: ngolacloud/seiva
docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    # Dark mode is the default (follows the OS, but dark leads the identity).
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    # Light mode.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    # Fira Sans for text, Fira Mono for code.
    text: Fira Sans
    code: Fira Mono
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/seiva.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

hooks:
  - docs_ext/mkdocs_hooks.py

plugins:
  - search

