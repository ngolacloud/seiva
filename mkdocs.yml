site_name: Delonix Seiva
site_url: https://ngolacloud.github.io/seiva/
site_description: >-
  A Rust backend framework for robust, high-criticality systems — ergonomic and
  batteries-included, as one compiled, no-GC binary.
repo_url: https://github.com/ngolacloud/seiva
repo_name: ngolacloud/seiva
docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    # Dark mode is the default (follows the OS, but dark leads the identity).
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    # Light mode.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    # Fira Sans for text, Fira Mono for code.
    text: Fira Sans
    code: Fira Mono
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/seiva.css

extra_javascript:
  - javascripts/search-shortcut.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

hooks:
  - docs_ext/mkdocs_hooks.py

plugins:
  - search
  # Bilingual docs: English is the base (served at the root); Angolan Portuguese
  # (pre-AO90 orthography) is served under /pt/. A `<name>.pt.md` file translates
  # `<name>.md`; untranslated pages fall back to English. The language switcher is
  # wired into the Material header automatically.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: pt
          name: Português (Angola)
          build: true
          # Translate the nav section/page titles (they come from mkdocs.yml, not
          # from the page files, so i18n cannot translate them automatically).
          nav_translations:
            Home: Início
            Getting started: Começar
            Seiva at a glance: Seiva num relance
            Quick install: Instalação rápida
            Quickstart: Arranque rápido
            Coming from a dynamic framework: Vindo de uma framework dinâmica
            Your first day: O teu primeiro dia
            Tutorial: Tutorial
            "Advanced tutorial: Building a shop": "Tutorial avançado: Construir uma loja"
            A modular monolith: Um monólito modular
            Modules own their data: Os módulos são donos dos seus dados
            Events between modules: Eventos entre módulos
            Authorization across modules: Autorização entre módulos
            Testing the shop: Testar a loja
            Monolith to microservices: Do monólito aos microserviços
            What to read next: O que ler a seguir
            Topic guides: Guias temáticos
            The data layer: A camada de dados
            Models and schema: Modelos e schema
            Making queries: Fazer consultas
            Migrations: Migrações
            Transactions: Transacções
            Raw SQL: SQL cru
            Multiple databases: Múltiplas bases de dados
            The transport layer: A camada de transporte
            Application and composition: Aplicação e composição
            Controllers and routing: Controladores e rotas
            Facades, the contract: Fachadas, o contrato
            Middleware layers: Camadas de middleware
            Requests and responses: Pedidos e respostas
            API documents: Documentos de API
            Validation and DTOs: Validação e DTOs
            Authentication: Autenticação
            Authorization: Autorização
            Security: Segurança
            Observability: Observabilidade
            Messaging and events: Mensagens e eventos
            Background workers: Workers em segundo plano
            CQRS dispatch: Despacho CQRS
            Caching: Cache
            Pagination: Paginação
            Sending email: Enviar email
            Sessions: Sessões
            Serialization: Serialização
            Configuration: Configuração
            Testing: Testes
            Performance and cloud-native: Desempenho e cloud-native
            LLVM release profile: Perfil de release LLVM
            Production-path load: Carga no caminho de produção
            Admin console migration: Migração da consola de admin
            DORM (the data layer): DORM (a camada de dados)
            Schema and models: Schema e modelos
            Relations: Relações
            Backends: Backends
            CLI and Studio: CLI e Studio
            Using DORM from Seiva: Usar o DORM a partir do Seiva
            dx (the package manager): dx (o gestor de pacotes)
            Package management: Gestão de pacotes
            dx vs Cargo: dx vs Cargo
            Using dx with Seiva: Usar o dx com o Seiva
            Reference: Referência
            The seiva CLI: O CLI seiva
            Settings and environment: Definições e ambiente
