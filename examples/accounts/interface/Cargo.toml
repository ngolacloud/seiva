# Interface layer of the `accounts` example: the transport-facing shell.
# Depends on the facade (the trait it exposes). Must not depend on
# infrastructure or domain in PRODUCTION code (ADR 0003). HTTP/gRPC wiring is a
# later phase.
#
# The dev-dependencies exist only for the composition test, which wires the
# in-memory infrastructure + the seiva-testing doubles into a ready
# `AccountsService` and drives it through `AccountsApi` end to end — the module
# independence/integration proof. They never enter a release build.
[package]
name = "accounts-interface"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
accounts-facade = { path = "../facade" }
# The controller is generic over the repository port, so the interface depends on
# `application` (the service + the `CredentialRepository` port) but NEVER on the
# `infrastructure` crate — the layering rule forbids `interface -> infrastructure`.
# The composition root injects the concrete repository.
accounts-application = { path = "../application" }
# The controller macro + contract, the HTTP primitives it emits, and the
# trait-only ports the in-process `runtime` adapters implement.
delonix-seiva = { workspace = true }
seiva-http = { path = "../../../crates/seiva-http" }
seiva-ports = { path = "../../../crates/seiva-ports" }
async-trait = { workspace = true }
axum = "0.8"

[dev-dependencies]
# Tests wire the in-memory repository into the controller — the composition the
# real `apps/` root performs. A dev-dependency, so the layering rule (which reads
# only `[dependencies]`) still forbids a production `interface -> infrastructure`
# edge.
accounts-infrastructure = { path = "../infrastructure" }
seiva-testing = { path = "../../../crates/seiva-testing" }
seiva-auth = { path = "../../../crates/seiva-auth" }
# `tokio` is here only for `#[tokio::test]`.
tokio = { version = "1", features = ["rt", "macros"] }
# Drives the generated router without a live server via `ServiceExt::oneshot`.
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
