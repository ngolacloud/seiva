# Facade layer of the `orders` shop example module: the public, versioned
# contract and DTOs. The generated controller uses these DTOs as the wire types,
# so the write DTOs derive `serde` + implement `seiva_http::Validate` and the
# error maps to an RFC 9457 `Problem` here (like `examples/accounts`).
[package]
name = "shop-orders-facade"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
delonix-seiva = { workspace = true }
seiva-http = { path = "../../../../crates/seiva-http" }
serde = { workspace = true }
# For `StatusCode` in the `From<OrdersError> for Problem` mapping (the `409`
# idempotency conflict). `seiva-http` already pulls axum; naming it here keeps the
# status constant in the facade's own error mapping.
axum = "0.8"
