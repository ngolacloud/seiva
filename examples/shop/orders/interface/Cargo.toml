# Interface layer of the `orders` shop example: the HTTP transport.
#
# The `#[seiva::controller]` lives HERE; the controller is generic over the
# repository port, so this layer depends on `application` but NEVER on
# `infrastructure` (the layering rule forbids `interface -> infrastructure`).
[package]
name = "shop-orders-interface"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
shop-orders-facade = { path = "../facade" }
shop-orders-application = { path = "../application" }
delonix-seiva = { workspace = true }
seiva-http = { path = "../../../../crates/seiva-http" }
seiva-ports = { workspace = true }
# The command bus the controller dispatches `place` through (ADR 0020): the
# `Mediator`, the transport-free `Validate`/`Transactional` behaviors and the
# `CommandHandler` the controller implements. CQRS is allowed in this layer.
seiva-cqrs = { path = "../../../../crates/seiva-cqrs" }
async-trait = { workspace = true }
axum = "0.8"
# The command body is fingerprinted as canonical JSON for the `Idempotent` behavior.
serde_json = "1"

[dev-dependencies]
shop-orders-infrastructure = { path = "../infrastructure" }
shop-orders-domain = { path = "../domain" }
# In-memory idempotency store + unit-of-work doubles for the bus tests.
seiva-testing = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
tower = { version = "0.5", features = ["util"] }
