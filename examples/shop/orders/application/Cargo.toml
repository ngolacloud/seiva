# Application layer of the `orders` shop example: the service (facade impl) and the
# outbound port. Depends on domain, its own facade (DTOs + trait) and
# seiva-ports. Not on infrastructure, interface, or delonix-seiva directly
# (ADR 0003).
[package]
name = "shop-orders-application"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
shop-orders-domain = { path = "../domain" }
shop-orders-facade = { path = "../facade" }
seiva-ports = { workspace = true }
# CQRS dispatch for the `orders` module: a `PlaceOrder` command + a cached
# `GetOrder` query through a Mediator. CQRS lives in the application layer, and
# `seiva-cqrs` is allowed there (the layering rule only forbids `delonix-seiva`).
seiva-cqrs = { path = "../../../../crates/seiva-cqrs" }
# Domain events are published as a JSON envelope (the DORM outbox publisher
# parses the payload as JSON).
serde_json = "1"

[dev-dependencies]
seiva-testing = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
