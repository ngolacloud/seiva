# Application layer of the `notifications` shop example: the service (facade impl) and the
# outbound port. Depends on domain, its own facade (DTOs + trait) and
# seiva-ports. Not on infrastructure, interface, or delonix-seiva directly
# (ADR 0003).
[package]
name = "shop-notifications-application"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
shop-notifications-domain = { path = "../domain" }
shop-notifications-facade = { path = "../facade" }
seiva-ports = { workspace = true }
# Domain events are published as a JSON envelope (the DORM outbox publisher
# parses the payload as JSON).
serde_json = "1"

[dev-dependencies]
seiva-testing = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
