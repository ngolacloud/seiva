# Interface layer of the `notifications` shop example: the HTTP transport.
#
# The `#[seiva::controller]` lives HERE; the controller is generic over the
# repository port, so this layer depends on `application` but NEVER on
# `infrastructure` (the layering rule forbids `interface -> infrastructure`).
[package]
name = "shop-notifications-interface"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
shop-notifications-facade = { path = "../facade" }
shop-notifications-application = { path = "../application" }
delonix-seiva = { workspace = true }
seiva-http = { path = "../../../../crates/seiva-http" }
seiva-ports = { workspace = true }
async-trait = { workspace = true }
axum = "0.8"

[dev-dependencies]
shop-notifications-infrastructure = { path = "../infrastructure" }
tokio = { workspace = true, features = ["rt", "macros"] }
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
