# Facade layer of the `notifications` shop example module: the public, versioned
# contract and DTOs. The generated controller uses these DTOs as the wire types,
# so the write DTO derives `serde` + implements `seiva_http::Validate` and the
# error maps to an RFC 9457 `Problem` here (like `examples/accounts`).
[package]
name = "shop-notifications-facade"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
delonix-seiva = { workspace = true }
seiva-http = { path = "../../../../crates/seiva-http" }
serde = { workspace = true }
