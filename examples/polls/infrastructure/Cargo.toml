# Infrastructure layer of the `polls` example: the repository adapter.
# Depends on application + domain + seiva-ports. Not on interface (ADR 0003).
[package]
name = "polls-infrastructure"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
polls-application = { path = "../application" }
polls-domain = { path = "../domain" }
seiva-ports = { workspace = true }

[dev-dependencies]
# Composition-level test: drive the module through the REAL in-memory adapter
# (not the application's FakeRepo) via the public facade, the shape a running
# composition root uses.
polls-facade = { path = "../facade" }
seiva-testing = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
