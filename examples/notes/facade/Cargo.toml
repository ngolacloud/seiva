# Facade layer of the canonical `notes` example module: the public contract.
# May depend only on shared/kernel and the Seiva macros (ADR 0003).
[package]
name = "notes-facade"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
seiva = { workspace = true }
# The contract carries the framework request context `&Ctx` on its write methods
# (the macro skips it from the wire, ADR 0006): the interface derives the tenant
# `Scope` from it server-side (SG1 / ADR 0029), never from the request body. The
# layer rule (`seiva lint`) allows this — it forbids only DORM and the lower
# layers, never the HTTP kernel; `examples/accounts/facade` depends on it the same way.
seiva-http = { path = "../../../crates/seiva-http" }
