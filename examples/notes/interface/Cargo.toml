# Interface layer of the `notes` example: the transport-facing shell.
# Depends on the facade (the trait it exposes). Must not depend on
# infrastructure or domain (ADR 0003). HTTP/gRPC wiring is a later phase.
[package]
name = "notes-interface"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
notes-facade = { path = "../facade" }
# The interface holds the application service and the re-exported `NoteRepository`
# port, derives the tenant `Scope` from the `&Ctx`, and delegates. It depends on
# `application` (never `infrastructure`/`domain`) and the HTTP/ports kernel.
notes-application = { path = "../application" }
seiva-http = { path = "../../../crates/seiva-http" }
seiva-ports = { workspace = true }
