# Interface layer of the `notes` example: the transport-facing shell.
# Depends on the facade (the trait it exposes). Must not depend on
# infrastructure or domain (ADR 0003). HTTP/gRPC wiring is a later phase.
[package]
name = "notes-interface"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
notes-facade = { path = "../facade" }
