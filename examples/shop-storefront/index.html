<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop — a dxjs storefront</title>
    <style>
      body { font: 16px/1.6 "Fira Sans", system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; color: #1b1f24; }
      h1 { color: #0c4b33; } h2 { color: #0c4b33; border-bottom: 1px solid #0c4b3322; padding-bottom: .2rem; margin-top: 1.6rem; }
      .api { color: #667; font-size: .85rem; } .status { color: #0e7490; font-weight: 600; margin-left: .5rem; }
      .err { color: #c53030; }
      ul.products { list-style: none; padding: 0; }
      ul.products li { display: flex; gap: 1rem; align-items: center; padding: .5rem 0; border-bottom: 1px solid #0001; }
      ul.products .name { flex: 1; font-weight: 600; } ul.products .price { color: #0e7490; }
      label { display: block; margin: .5rem 0; } input { padding: .3rem .5rem; margin: 0 .3rem; }
      button { background: #0e7490; color: #fff; border: 0; border-radius: 4px; padding: .35rem .7rem; cursor: pointer; }
      form { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
