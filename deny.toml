# cargo-deny configuration — the CVE/KEV and supply-chain gate for Seiva.
#
# `cargo deny check` runs in CI (see .github/workflows/ci.yml) over the public
# workspace. It fails the build on a known RUSTSEC advisory, a yanked crate, a
# disallowed licence, a wildcard dependency or an unknown source registry.
#
# EXCEPTIONS POLICY: an advisory may only be silenced by adding its RUSTSEC id to
# `advisories.ignore` below WITH a dated, justified comment (why it does not
# affect Seiva, and the date it was reviewed). Remove the entry as soon as a
# fixed version is available. An undated or unexplained ignore is a review-blocker.

[advisories]
version = 2
# A yanked dependency is treated as hard a failure as a vulnerable one.
yanked = "deny"
# The default-feature gate (`cargo deny check`) is clean today and needs NO
# exception. The OPTIONAL broker backends of seiva-messaging (features nats /
# amqp / kafka — none in `default`) do carry advisories (async-nats -> an old
# rustls-webpki, lapin -> unmaintained instant/rustls-pemfile, rskafka -> an old
# zstd-safe); the real fix is bumping those broker clients, tracked in
# docs/progress.md. The CI runs an all-features advisory pass that SURFACES them
# (informational), so they are never hidden, rather than burying real
# cert-verification vulnerabilities behind blanket ignores here.
#
# Format for a genuine exception, when one is unavoidable:
#   # RUSTSEC-YYYY-NNNN — <crate>: <why it does not affect Seiva>. Reviewed
#   # YYYY-MM-DD; remove once <fixed-version> is reachable.
ignore = []

[licenses]
version = 2
# Permissive licences compatible with Seiva's own "MIT OR Apache-2.0".
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# A duplicate version is a warning (noise to watch), not a build break.
multiple-versions = "warn"
# A wildcard (`*`) on a crates.io dependency is a supply-chain risk, but every
# wildcard in this workspace today is an internal `{ path = "..." }` dependency
# between the 5-layer module crates (a local wildcard with no such risk).
# `allow-wildcard-paths` exempts path deps on *private* crates but not on the
# publishable ones (seiva-cli, seiva-cqrs, ...), so wildcards are a WARNING here:
# still surfaced, but not failing the gate on an internal-only pattern. A real
# registry `*` would stand out in the warning and must be fixed before publish.
wildcards = "warn"
allow-wildcard-paths = true

[sources]
# Only crates.io by default. The DORM-git-coupled crates are EXCLUDED from the
# public workspace, so no git source should appear here; a new one is a mistake.
unknown-registry = "deny"
unknown-git = "deny"
