apiVersion: v1
kind: Service
metadata:
  name: {{ include "seiva-server.fullname" . }}
  labels:
    {{- include "seiva-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if and .Values.metrics.enabled (not .Values.metrics.serviceMonitor.enabled) }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
  selector:
    {{- include "seiva-server.selectorLabels" . | nindent 4 }}
