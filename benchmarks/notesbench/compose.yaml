# Run with `delonix stack up` (or `docker compose up`).
# Optional backing services live in `compose/*.yaml`; opt in explicitly,
# e.g. `delonix stack up -f compose.yaml -f compose/postgres.yaml`.
services:
  notesbench:
    build:
      context: .
      dockerfile: Delonixfile
    image: notesbench:dev
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      SEIVA_HTTP_ADDR: 0.0.0.0:8080
    # Distroless carries no shell for a CMD healthcheck; readiness is an
    # httpGet on /health/ready (Kubernetes) — see docs/first-day.md.
    restart: unless-stopped
# Placeholder for opt-in backing services; nothing is enabled by default.
# To add one: create compose/<service>.yaml and pass it with -f.
