# A single trusted edge in front of the two replicas. `option forwardfor` sets
# X-Forwarded-For to the real client IP; the replicas trust it
# (ADMIN_DATA_E2E_REDIS_URL turns on trust_forwarded_for) so the per-client rate
# budget keys on the client, not on this proxy's address — and the shared Redis
# store makes that ONE budget across both replicas.
global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend fe
    bind *:8080
    default_backend be

backend be
    balance roundrobin
    option httpchk GET /health/ready
    server app1 app1:8098 check inter 1s fall 3 rise 1
    server app2 app2:8098 check inter 1s fall 3 rise 1
