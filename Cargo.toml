# Delonix Seiva — a Rust backend framework for robust, high-criticality systems.
#
# Seiva is the SERVICE, DISTRIBUTION and DOMAIN layer around a data source. The
# data source by default is DORM (the Delonix ORM, an independent product), wired
# in only through the optional `seiva-data-dorm` gateway behind the `dorm`
# feature. The framework CORE never depends on DORM: a project whose every module
# uses an external data layer pulls in no ORM at all.
#
# Dependency is one-way: Seiva depends on DORM (by feature); DORM never on Seiva.
[workspace]
resolver = "2"
# The DORM gateway is intentionally NOT a member: building it needs access to the
# private DORM repo (a pinned git dependency), which the public CI does not have
# without a token. It is built on its own to prove the boundary crossing until
# the `dorm` feature wires it in (owner decision: CI token + build coupling).
exclude = [
    "crates/seiva-data-dorm",
    # The sqlx and SeaORM reference adapters (ADR 0030, Fatia 2). DORM-free, but
    # kept OUT of the default members so the core build pulls neither sqlx nor
    # SeaORM nor a Postgres client (ADR 0030: "none in the default workspace
    # members"). They are built in the dedicated `adapters` CI matrix job.
    "crates/seiva-data-sqlx",
    "crates/seiva-data-seaorm",
    "crates/seiva-outbox-relay",
    # RAG worker and the MCP-over-HTTP endpoint are DORM-git-coupled too.
    "crates/seiva-rag-worker",
    "crates/seiva-mcp",
    # The DORM end-to-end proof: the real "main" composing the gateway, the
    # outbox relay and the server over real DORM. Built by the `dorm-e2e` CI job.
    "apps/dorm-e2e",
    # The data-layer admin proof (ADR 0009 Phase-3): a DORM-backed CRUD module
    # (`Catalog`) the console drives over PG. DORM-coupled, so excluded like the
    # siblings; built by the token-gated `dorm-gateway` job.
    "apps/admin-data-e2e",
    # The ADR 0033 delivery end-to-end proof: the REAL reqwest/TLS `HttpSender`
    # adapter + an e2e that signs and POSTs over a LOCAL HTTPS server. DORM-free,
    # but reqwest + rustls + a TLS test server are heavy, so it is excluded from
    # the default workspace (like the siblings) and built by its own dedicated CI
    # job via `--manifest-path`. Nothing in `cargo check --workspace` links it.
    "apps/webhook-delivery-e2e",
    # The ADR 0034 delivery JOB composition root: the real `seiva-jobs` service
    # that composes the DORM delivery ledger + the reqwest/TLS `HttpSender` + the
    # signing secrets and runs `run_delivery_worker` to drain the ledger. DORM-
    # coupled (via the ledger) and links reqwest + rustls, so — like the siblings —
    # it is excluded from the default workspace and built by its own job via
    # `--manifest-path`. Nothing in `cargo check --workspace` links it.
    "apps/seiva-jobs",
]
members = [
    # Trait-only boundary the application layer codes against: UnitOfWork,
    # EventPublisher, Clock, IdGenerator. No runtime, no macros, no deps. Kept
    # SemVer-stable by policy so a module's `application` can declare what it
    # needs without depending on the framework.
    "crates/seiva-ports",
    # Transport-neutral wire-contract types (Validate, ValidationError) a module's
    # `facade` validates against without naming a transport crate (ADR 0003). No
    # axum, no http. `seiva-http` re-exports them. Kept SemVer-stable by policy.
    "crates/seiva-contract",
    # In-memory reference doubles for the ports, so a module's application layer
    # unit-tests with no server, broker or database. A dev-dependency only.
    "crates/seiva-testing",
    # The ambient-transaction read-seam shared by the handle-based SQL reference
    # adapters (ADR 0030). Pure — only `seiva-ports` + `tokio`, no ORM, no DORM — so
    # it IS a default member (covered by `check`); the ORM adapters that depend on it
    # by path stay excluded.
    "crates/seiva-sql-ambient-tx",
    # The framework's procedural macros (#[seiva::facade], ...).
    "crates/seiva-macros",
    # Messaging: CloudEvents envelope + Publisher + broker backends (features).
    # Moved out of DORM with its history (Parte DORM-A). Data-layer-free.
    "crates/seiva-messaging",
    # The in-process event bus core (ADR 0021): a subscriber registry + an
    # inbox-deduplicating dispatcher, the in-process twin of the broker drain so a
    # subscriber handler is identical in a monolith and after `module split`.
    # DORM-free and broker-free (the outbox driver/worker is Fase 2, DORM-coupled).
    "crates/seiva-events",
    # The framework crate: the public entrypoint downstream apps depend on.
    "crates/seiva",
    # The worker runtime extracted out of the umbrella (the loop half of the
    # data-layer boundary). Data-layer-free; re-exported as `seiva::worker`.
    "crates/seiva-worker",
    # The architecture fitness-function lint, extracted out of the umbrella. A
    # library plus the `cargo-seiva` binary (`cargo seiva lint`).
    "crates/cargo-seiva",
    # The HTTP transport: axum/tower, RFC 9457 errors, facade-driven permission
    # guard, health endpoints. Data-layer-free, so a workspace member.
    "crates/seiva-http",
    # The OPTIONAL admin console — an extension of the base (ADR 0008), NOT a
    # dependency of it. A workspace member so CI builds/tests it, but nothing in
    # the base depends on it: a backend built without it has no `/admin` route.
    "crates/seiva-console-admin",
    # The OPTIONAL Redis-backed distributed rate-limit store (ADR 0015). Not a
    # base dependency; a multi-replica deployment opts in. A member so CI builds
    # and audits it (the `redis` client is not DORM-git-coupled).
    "crates/seiva-ratelimit-redis",
    # The OPTIONAL real-time hub (ADR 0031): a protocol-neutral WebSocket + SSE
    # fan-out primitive. DORM-free and runtime-free by default (the axum transport
    # is behind the `ws` feature, the Redis bridge behind `redis-bridge`); a member
    # so CI builds/tests it, but nothing in the base depends on it.
    "crates/seiva-realtime",
    # The OPTIONAL object store (ADR 0032): a tenant-aware, fail-closed
    # `ObjectStore` port with a path-confined local-fs adapter (streaming,
    # multipart, presigned URLs) and a seiva-resilience decorator. DORM-free and
    # runtime-free by default (no executor linked; the vendor S3 adapter is a
    # future feature); a member so CI builds/tests it, nothing in the base
    # depends on it.
    "crates/seiva-storage",
    # Password/credential primitives (Argon2id PHC) — accounts out of DORM's CLI.
    "crates/seiva-auth",
    # Identity: one verified Principal + Authenticator (OIDC/JWT via JWKS). Transport-free.
    "crates/seiva-identity",
    # Typed 12-factor configuration + an AppEnv production-safety guard.
    "crates/seiva-config",
    # Standard Webhooks signing/verification (HMAC-SHA256, replay window).
    "crates/seiva-webhooks",
    # Wiring of the ADR 0033 delivery engine into the runtime: a seiva-events
    # subscriber that enqueues one delivery per subscription (ADR 0021) and the
    # DeliveryEngine::tick job on the shared worker loop (ADR 0034). DORM-free and
    # http-client-free (the real reqwest sender lives in the excluded e2e crate),
    # so a default member.
    "crates/seiva-webhook-delivery",
    # Production resilience primitives: a circuit breaker (closed/open/half-open),
    # a retry policy with exponential backoff (the SAME schedule as the outbox
    # relay's RelayPolicy) and a timeout wrapper. Data-layer-free, so a member.
    "crates/seiva-resilience",
    # The inter-service client: how one module calls another module's service once
    # split into microservices, wrapping every call in seiva-resilience's breaker +
    # retry + timeout over an injected transport. The first real consumer of the
    # resilience primitives. Transport-agnostic and data-layer-free, so a member.
    "crates/seiva-client",
    # Application-layer CQRS dispatch: a statically-wired command/query mediator
    # with typed middleware (instrumentation, query caching). Data-layer-free.
    "crates/seiva-cqrs",
    # gRPC artefact generation (proto3 + tonic Status) from a facade descriptor.
    # Data-layer-free: reads only the contract, so a workspace member.
    "crates/seiva-grpc",
    # OpenAPI 3.1 document generation from facade descriptors (replaces the
    # seiva-http stub). Data-layer-free.
    "crates/seiva-openapi",
    # Standalone proof that `#[seiva::controller]` generates a facade-driven axum
    # router end to end (guards, versioned paths, RFC 9457). Data-layer-free.
    "crates/seiva-controller-test",
    # Native observability (ADR 0027): the opt-in Prometheus `/metrics` exporter
    # and OTLP tracing, installed at the composition root. The library crates
    # record against the lightweight `metrics` facade; the heavy exporters live
    # here behind features. DORM-free.
    "crates/seiva-observability",
    # The runtime that boots a Seiva service (the `dorm-api` replacement): the
    # HTTP app (controllers + /openapi.json + /health), a worker host and
    # 12-factor config with graceful shutdown. Data-layer-free (the DORM outbox
    # relay is injected behind the `dorm` feature once the CI token exists).
    "crates/seiva-server",
    # The installable CLI (`cargo install seiva-cli`, binary `seiva`): scaffolds
    # projects and modules, runs the dev loop, lints the architecture.
    "crates/seiva-cli",
    # The canonical five-layer module, wired to the real framework crates: the
    # independence/integration proof and the shape the scaffolder emits (ADR 0003).
    "examples/notes/facade",
    "examples/notes/domain",
    "examples/notes/application",
    "examples/notes/infrastructure",
    "examples/notes/interface",
    # The `polls` module (five layers): the Django "first app" tutorial (questions,
    # choices, voting, results) ported to Seiva. In-memory repository, DORM-free.
    "examples/polls/facade",
    "examples/polls/domain",
    "examples/polls/application",
    "examples/polls/infrastructure",
    "examples/polls/interface",
    # The `shop` e-commerce example: five INDEPENDENT five-layer modules (catalog,
    # inventory, orders, payments, notifications) that share no crate — the
    # monolith→microservices tutorial's foundation. Composition and domain events
    # tell the story, not cross-module coupling. In-memory repositories, DORM-free.
    "examples/shop/catalog/facade",
    "examples/shop/catalog/domain",
    "examples/shop/catalog/application",
    "examples/shop/catalog/infrastructure",
    "examples/shop/catalog/interface",
    "examples/shop/inventory/facade",
    "examples/shop/inventory/domain",
    "examples/shop/inventory/application",
    "examples/shop/inventory/infrastructure",
    "examples/shop/inventory/interface",
    "examples/shop/orders/facade",
    "examples/shop/orders/domain",
    "examples/shop/orders/application",
    "examples/shop/orders/infrastructure",
    "examples/shop/orders/interface",
    "examples/shop/payments/facade",
    "examples/shop/payments/domain",
    "examples/shop/payments/application",
    "examples/shop/payments/infrastructure",
    "examples/shop/payments/interface",
    "examples/shop/notifications/facade",
    "examples/shop/notifications/domain",
    "examples/shop/notifications/application",
    "examples/shop/notifications/infrastructure",
    "examples/shop/notifications/interface",
    # The `accounts` module (five layers) over seiva-auth: a real module the CLI
    # `seiva user create` persists through. In-memory repository, DORM-free.
    "examples/accounts/facade",
    "examples/accounts/domain",
    "examples/accounts/application",
    "examples/accounts/infrastructure",
    "examples/accounts/interface",
    # Composition root for the admin browser E2E (§10): accounts module + the
    # console + a token authenticator. Built in CI (catches rot); the browser
    # E2E itself is run on demand (needs a headless Chrome), not in `cargo test`.
    "apps/admin-e2e",
    # Composition root for the shop tutorial: the five shop modules + the console
    # + a demo token authenticator, served over HTTP (`/openapi.json`, `/docs`,
    # `/health`, `/admin`). A binary app, not an example module.
    "apps/shop-api",
]

[workspace.package]
version = "0.2.2"
edition = "2021"
# Dual-licensed as the Rust ecosystem is by convention, matching the Delonix
# family (DORM, Delonix Engine), so a downstream crate can pick whichever fits.
license = "MIT OR Apache-2.0"
authors = ["NgolaCloud <angolar.devops@gmail.com>"]
repository = "https://github.com/ngolacloud/seiva"
homepage = "https://github.com/ngolacloud/seiva"
rust-version = "1.75"

[workspace.dependencies]
seiva-ports = { version = "0.2.2", path = "crates/seiva-ports" }
# default-features off here (not at the member use site): next to `workspace =
# true` the member-level `default-features` key is ignored, so the DORM toggle
# must be declared off at the workspace root and re-enabled by `seiva-cli`'s
# own `dorm` feature.
seiva = { version = "0.2.2", path = "crates/seiva", default-features = false }
seiva-worker = { version = "0.2.2", path = "crates/seiva-worker" }
cargo-seiva = { version = "0.2.2", path = "crates/cargo-seiva" }
seiva-testing = { version = "0.2.2", path = "crates/seiva-testing" }
seiva-macros = { version = "0.2.2", path = "crates/seiva-macros" }
async-trait = "0.1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
# Dynamic shell completion for the `seiva` CLI (`seiva completion <shell>`):
# commands, flags AND values (module names, kinds, data layers) on TAB.
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
tokio = { version = "1" }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9" }
syn = { version = "3" }
quote = "1"
proc-macro2 = "1"

# Release profile (Seiva §9 — LLVM via Cargo/rustc). ThinLTO + a single codegen
# unit let LLVM optimise across crate boundaries (smaller, faster binary) at the
# cost of build time; `strip` drops symbols for a leaner artefact. Deliberately
# NO `target-cpu=native`: the default release binary must stay portable across
# the hosts a PaaS schedules it on (set `RUSTFLAGS=-C target-cpu=native` per-host
# only when you control the target). `panic` stays `unwind` so tests and any
# `catch_unwind` boundary keep working. PGO is opt-in and workload-specific, not
# baked into the default profile. Measurements: docs/topics/performance/llvm-profile.md.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
