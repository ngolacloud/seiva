# Delonix Seiva — a Rust backend framework for robust, high-criticality systems.
#
# Seiva is the SERVICE, DISTRIBUTION and DOMAIN layer around a data source. The
# data source by default is DORM (the Delonix ORM, an independent product), wired
# in only through the optional `seiva-data-dorm` gateway behind the `dorm`
# feature. The framework CORE never depends on DORM: a project whose every module
# uses an external data layer pulls in no ORM at all.
#
# Dependency is one-way: Seiva depends on DORM (by feature); DORM never on Seiva.
[workspace]
resolver = "2"
# The DORM gateway is intentionally NOT a member: building it needs access to the
# private DORM repo (a pinned git dependency), which the public CI does not have
# without a token. It is built on its own to prove the boundary crossing until
# the `dorm` feature wires it in (owner decision: CI token + build coupling).
exclude = [
    "crates/seiva-data-dorm",
    "crates/seiva-outbox-relay",
    # RAG worker and the MCP-over-HTTP endpoint are DORM-git-coupled too.
    "crates/seiva-rag-worker",
    "crates/seiva-mcp",
]
members = [
    # Trait-only boundary the application layer codes against: UnitOfWork,
    # EventPublisher, Clock, IdGenerator. No runtime, no macros, no deps. Kept
    # SemVer-stable by policy so a module's `application` can declare what it
    # needs without depending on the framework.
    "crates/seiva-ports",
    # In-memory reference doubles for the ports, so a module's application layer
    # unit-tests with no server, broker or database. A dev-dependency only.
    "crates/seiva-testing",
    # The framework's procedural macros (#[seiva::facade], ...).
    "crates/seiva-macros",
    # Messaging: CloudEvents envelope + Publisher + broker backends (features).
    # Moved out of DORM with its history (Parte DORM-A). Data-layer-free.
    "crates/seiva-messaging",
    # The framework crate: the public entrypoint downstream apps depend on.
    "crates/delonix-seiva",
    # The HTTP transport: axum/tower, RFC 9457 errors, facade-driven permission
    # guard, health endpoints. Data-layer-free, so a workspace member.
    "crates/seiva-http",
    # Password/credential primitives (Argon2id PHC) — accounts out of DORM's CLI.
    "crates/seiva-auth",
    # Typed 12-factor configuration + an AppEnv production-safety guard.
    "crates/seiva-config",
    # Standard Webhooks signing/verification (HMAC-SHA256, replay window).
    "crates/seiva-webhooks",
    # Application-layer CQRS dispatch: a statically-wired command/query mediator
    # with typed middleware (instrumentation, query caching). Data-layer-free.
    "crates/seiva-cqrs",
    # gRPC artefact generation (proto3 + tonic Status) from a facade descriptor.
    # Data-layer-free: reads only the contract, so a workspace member.
    "crates/seiva-grpc",
    # OpenAPI 3.1 document generation from facade descriptors (replaces the
    # seiva-http stub). Data-layer-free.
    "crates/seiva-openapi",
    # Standalone proof that `#[seiva::controller]` generates a facade-driven axum
    # router end to end (guards, versioned paths, RFC 9457). Data-layer-free.
    "crates/seiva-controller-test",
    # The runtime that boots a Seiva service (the `dorm-api` replacement): the
    # HTTP app (controllers + /openapi.json + /health), a worker host and
    # 12-factor config with graceful shutdown. Data-layer-free (the DORM outbox
    # relay is injected behind the `dorm` feature once the CI token exists).
    "crates/seiva-server",
    # The installable CLI (`cargo install seiva-cli`, binary `seiva`): scaffolds
    # projects and modules, runs the dev loop, lints the architecture.
    "crates/seiva-cli",
    # The canonical five-layer module, wired to the real framework crates: the
    # independence/integration proof and the shape the scaffolder emits (ADR 0003).
    "examples/notes/facade",
    "examples/notes/domain",
    "examples/notes/application",
    "examples/notes/infrastructure",
    "examples/notes/interface",
    # The `accounts` module (five layers) over seiva-auth: a real module the CLI
    # `seiva user create` persists through. In-memory repository, DORM-free.
    "examples/accounts/facade",
    "examples/accounts/domain",
    "examples/accounts/application",
    "examples/accounts/infrastructure",
    "examples/accounts/interface",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Dual-licensed as the Rust ecosystem is by convention, matching the Delonix
# family (DORM, Delonix Engine), so a downstream crate can pick whichever fits.
license = "MIT OR Apache-2.0"
authors = ["NgolaCloud <angolar.devops@gmail.com>"]
repository = "https://github.com/ngolacloud/seiva"
homepage = "https://github.com/ngolacloud/seiva"
rust-version = "1.75"

[workspace.dependencies]
seiva-ports = { version = "0.1.0", path = "crates/seiva-ports" }
# default-features off here (not at the member use site): next to `workspace =
# true` the member-level `default-features` key is ignored, so the DORM toggle
# must be declared off at the workspace root and re-enabled by `seiva-cli`'s
# own `dorm` feature.
delonix-seiva = { version = "0.1.0", path = "crates/delonix-seiva", default-features = false }
seiva-testing = { version = "0.1.0", path = "crates/seiva-testing" }
seiva-macros = { version = "0.1.0", path = "crates/seiva-macros" }
async-trait = "0.1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1" }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9" }
syn = { version = "3" }
quote = "1"
proc-macro2 = "1"
